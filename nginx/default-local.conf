server {
    listen 80;
    server_name _;

    # nginx's own default (1MB) sits in front of the API's [RequestSizeLimit] and rejects
    # anything bigger before the API ever sees the request - a branch installer is ~164MB, so
    # every upload through /api/releases/upload failed with a plain 413, never reaching the
    # code or its own logging at all. Set high enough for an installer with real headroom to
    # grow, not just today's size.
    client_max_body_size 500M;

    # Security Headers — prevent XSS, clickjacking, MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Security Policy — prevent inline scripts, only allow same-origin
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;

    # The built asset files carry a content hash in their names, so a given name always holds
    # the same bytes and can be cached hard. A new build produces new names.
    location /assets/ {
        auth_basic off;
        proxy_pass http://client:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The actual internal dashboard - Sessions, Billing, Settings, everything under the
    # protected app shell (see App.jsx's "Protected App Shell" route) - is the only part of
    # this site that ever needed a front-door password. It used to sit on the whole domain
    # instead, which meant every public-facing page (password reset, the member portal, a
    # new branch's own setup wizard, the PC overlay a customer's browser opens) hit this same
    # password first - a password only the owner has ever been given. A reset link is read by
    # whoever asked for it, in their own inbox, having never seen this password and never
    # needing to: this front door was never meant to be theirs to open.
    location ~ ^/app(/|$) {
        auth_basic "Apple Esports Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://client:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Everything else the frontend serves - the landing page, login screens, the member
    # portal, setup wizards, forgot/reset password, the PC overlay - reachable directly by
    # whoever it is actually for, with no password in front of it. See the location above for
    # the one part of the site that still needs one.
    location / {
        auth_basic off;
        proxy_pass http://client:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # index.html must never be cached. It is the one file that names which hashed assets
        # to fetch, and it was being served with no Cache-Control at all - so browsers kept
        # their own copy, asked for asset names from a previous build, got 404s, and rendered
        # the dashboard as unstyled HTML. That happened on every deploy and needed every user
        # to hard-refresh. With four branches taking updates, that is not workable.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Route API traffic to the backend container — NO PASSWORD REQUIRED
    location /api/ {
        auth_basic off;
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route SignalR traffic with WebSocket upgrades — NO PASSWORD REQUIRED
    location /hubs/ {
        auth_basic off;
        proxy_pass http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable caching and proxy buffering for real-time
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 100s;
    }
}
